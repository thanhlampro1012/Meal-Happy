name: Publish Meal Happy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate app icons for iOS and Android
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/happymeal-pwa-venv
          /tmp/happymeal-pwa-venv/bin/python -m pip install --quiet 'cairosvg==2.8.2'
          mkdir -p docs/icons
          /tmp/happymeal-pwa-venv/bin/python - <<'PY'
          import cairosvg
          for size, name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              cairosvg.svg2png(url='docs/icon.svg',write_to='docs/icons/'+name,
                  output_width=size,output_height=size)
          PY
      - name: Validate static app and catalog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, statSync } from 'node:fs';
          const html=readFileSync('docs/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!script) throw Error('Missing app JavaScript');
          new Function(script);
          const data=JSON.parse(readFileSync('docs/catalog.json','utf8'));
          const expected=['Quận 1','Quận 3','Quận 5','Gò Vấp','Tân Bình'];
          if(data.places.length!==139)throw Error('Unexpected place count: '+data.places.length);
          if(data.places.some(p=>!expected.includes(p.area)))throw Error('Location outside five selected areas');
          let photos=0;
          for(const p of data.places){
            if(p.image?.startsWith('/venues/')){
              const path='docs'+p.image;
              if(!existsSync(path)||statSync(path).size<1024)throw Error('Missing photo: '+path);
              photos++;
            }
          }
          if(photos!==6)throw Error('Expected six sourced photos, got '+photos);
          console.log('Validated:',data.places.length,'venues in five districts;',photos,'photo files; app JavaScript syntax OK.');
          NODE
      - name: Validate cloud-sync code and PWA assets
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/firebase-sync.js
          node --input-type=module <<'NODE'
          import {readFileSync,statSync} from 'node:fs';
          const html=readFileSync('docs/index.html','utf8');
          if(!html.includes('Happy Meal')||html.includes('>Meal Happy<'))throw Error('Brand rename missing');
          const manifest=JSON.parse(readFileSync('docs/site.webmanifest','utf8'));
          if(manifest.short_name!=='Happy Meal'||manifest.display!=='standalone')throw Error('Invalid PWA identity');
          for(const [name,size] of [['apple-touch-icon.png',180],['icon-192.png',192],['icon-512.png',512]]){
            const f='docs/icons/'+name;
            const data=readFileSync(f);
            if(data.length<1500||data.readUInt32BE(16)!==size||data.readUInt32BE(20)!==size)throw Error('Broken icon '+f);
          }
          if(!html.includes('firebase-sync.js')||!html.includes('firebaseSetup'))throw Error('Missing cloud sign-in UI');
          const rules=readFileSync('firebase/firestore.rules','utf8');
          if(!rules.includes('request.auth.uid == uid')||rules.includes('allow read, write: if true'))throw Error('Unsafe rules');
          console.log('Happy Meal: PWA, icon sizes, Firebase sync syntax and rules verified');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published GitHub Pages
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          SITE_URL="${SITE_URL%/}/"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "$SITE_URL" -o /tmp/meal-happy-home.html \
              && curl -fsSL --max-time 20 "${SITE_URL}catalog.json" -o /tmp/meal-happy-catalog.json \
              && curl -fsSL --max-time 20 "${SITE_URL}venues/pizza-4ps-ben-thanh.jpg" -o /tmp/meal-happy-photo.jpg \
              && curl -fsSL --max-time 20 "${SITE_URL}site.webmanifest" -o /tmp/happy-meal-manifest.json \
              && curl -fsSL --max-time 20 "${SITE_URL}icons/apple-touch-icon.png" -o /tmp/happy-meal-apple.png \
              && curl -fsSL --max-time 20 "${SITE_URL}firebase-sync.js" -o /tmp/happy-meal-sync.js; then
              break
            fi
            if [ "$i" -eq 6 ]; then echo "Live Pages assets were not reachable" >&2; exit 1; fi
            sleep 5
          done
          grep -q "Happy Meal" /tmp/meal-happy-home.html
          node --input-type=module <<'NODE'
          import {readFileSync, statSync} from 'node:fs';
          const data=JSON.parse(readFileSync('/tmp/meal-happy-catalog.json','utf8'));
          if(data.places.length!==139)throw Error('Live site has wrong catalog size: '+data.places.length);
          if(statSync('/tmp/meal-happy-photo.jpg').size<1024)throw Error('Live image missing');
          const icon=readFileSync('/tmp/happy-meal-apple.png');
          if(icon.readUInt32BE(16)!==180)throw Error('Live apple icon wrong size');
          if(!readFileSync('/tmp/happy-meal-sync.js','utf8').includes('HappyMealCloud'))throw Error('Cloud module unavailable');
          if(JSON.parse(readFileSync('/tmp/happy-meal-manifest.json','utf8')).short_name!=='Happy Meal')throw Error('Live PWA manifest wrong');
          console.log('Live GitHub Pages smoke test passed: Happy Meal, 139 venues, PWA icon, manifest and Firebase module.');
          NODE
